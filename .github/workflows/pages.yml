name: Deploy EDCodex Redesign Preview to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - redesign-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static preview site
        run: |
          rm -rf _site
          mkdir -p _site/template
          cp -r redesign _site/redesign
          cp template/top8.jpg _site/template/top8.jpg
          cp favicon.ico _site/favicon.ico
          touch _site/.nojekyll
          cat <<'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./redesign/">
            <title>EDCodex Redesign Preview</title>
          </head>
          <body>
            <p>Redirecting to <a href="./redesign/">EDCodex Redesign Preview</a>…</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
